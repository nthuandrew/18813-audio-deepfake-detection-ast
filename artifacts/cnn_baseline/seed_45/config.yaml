experiment:
  name: cnn_baseline
  seed: 45
  output_dir: outputs/cnn_baseline/seed_45
data:
  la_root: data/raw/asvspoof2019/LA
  sample_rate: 16000
  clip_duration_seconds: 4.0
  n_fft: 1024
  win_length: 400
  hop_length: 160
  n_mels: 128
  f_min: 0
  f_max: 8000
  normalize: per_sample
  num_workers: 4
model:
  name: cnn
  channels:
  - 32
  - 64
  - 128
  - 256
  dropout: 0.3
training:
  epochs: 3
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.0001
  use_class_weight: true
  scheduler_patience: 2
  scheduler_factor: 0.5
  early_stopping_patience: 6
  device: auto
