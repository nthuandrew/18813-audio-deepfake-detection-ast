[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-deepfake-detection"
version = "0.1.0"
description = "AST and CNN baselines for ASVspoof 2019 LA audio deepfake detection"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0,<7",
  "soundfile>=0.12,<1",
  "torch>=2.2,<3",
  "torchaudio>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
add-validate-data = "audio_deepfake.data.validate:main"
add-train = "audio_deepfake.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
